
<!DOCTYPE html>
<html lang="th">
<head>

    <!-- Google Fonts -->

    <link rel="stylesheet" href="../shared/navbar.css">

<body>

    <script src="../shared/navbar.js"></script>

    <main class="container">

        <div class="paw paw-1">🐾</div>

            </div>
