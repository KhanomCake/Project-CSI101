<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบวิเคราะห์สายพันธุ์สุนัขที่เหมาะกับคุณ</title>
    <style>
        body { font-family: 'Sukhumvit Set', sans-serif; padding: 20px; background: #f5f5f5; }
        .quiz-card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        #result { margin-top: 25px; display: none; }
        .dog-item { display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .dog-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .dog-info h4 { margin: 0 0 5px 0; color: #333; }
        .dog-info p { margin: 5px 0 0 0; font-size: 13px; color: #666; }
        .badge { display: inline-block; background: #28a745; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="../shared/navbar.css">
</head>
<body>

<div class="quiz-card">
    <h2>ค้นหาสุนัขที่ใช่สำหรับคุณ</h2>
    
    <div class="form-group">
        <label>1. พื้นที่อยู่อาศัยของคุณ:</label>
        <select id="space">
            <option value="1">คอนโด / หอพัก (พื้นที่จำกัด)</option>
            <option value="3">ทาวน์เฮาส์ / บ้านมีพื้นที่เล็กน้อย</option>
            <option value="5">บ้านเดี่ยวมีสนามหญ้ากว้าง</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. เวลาในการพาไปออกกำลังกาย/เดินเล่น:</label>
        <select id="energy">
            <option value="1">แทบไม่มีเวลา / ชอบพักผ่อนอยู่บ้าน</option>
            <option value="3">เดินเล่นวันละ 30 นาที</option>
            <option value="5">ชอบวิ่ง/ออกกำลังกายวันละ 1-2 ชม.</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. การดูแลเรื่องขนและหวีขน:</label>
        <select id="grooming">
            <option value="1">ชอบหมาขนสั้น ดูแลง่าย ไม่ต้องแปรง</option>
            <option value="3">ขนยาวปานกลาง แปรงขนสัปดาห์ละครั้ง</option>
            <option value="5">แปรงขนทุกวัน / เข้าร้านตัดแต่งขนได้สบาย</option>
        </select>
    </div>

    <div class="form-group">
        <label>4. ประสบการณ์การเลี้ยงสุนัข:</label>
        <select id="experience">
            <option value="1">มือใหม่ ไม่เคยเลี้ยงมาก่อน</option>
            <option value="3">เคยเลี้ยงสุนัขมาบ้าง</option>
            <option value="5">ผู้เชี่ยวชาญ / ฝึกสุนัขพันธุ์ยากๆ ได้</option>
        </select>
    </div>

    <button onclick="submitQuiz()">วิเคราะห์ผลลัพธ์</button>

    <div id="result">
        <h3>สุนัข 3 อันดับที่เหมาะกับคุณที่สุด:</h3>
        <div id="dog-list"></div>
    </div>
</div>

<script src="recommend-dog-data.js"></script>
<script src="recommend-dog.js"></script>

    <script src="../shared/navbar.js"></script>
</body>
</html>
