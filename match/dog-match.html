<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาน้องหมาที่ใช่สำหรับคุณ</title>
    <style>
        button, input, select, textarea { font-family: inherit; }
        body { font-family: 'Kanit', sans-serif; color: #163e68; margin: 0; background: #f8fcff; }
        .quiz-card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        
        
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 12px; background: #4399f5; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2f86e6; }
        
        
        .btn-back { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40%; 
            padding: 12px; 
            background: #e2e8f0; 
            color: #475569; 
            text-decoration: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        .btn-back:hover { background: #cbd5e1; }

        #result { margin-top: 25px; display: none; }
        .dog-item { display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .dog-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .dog-info h4 { margin: 0 0 5px 0; color: #333; }
        .dog-info p { margin: 5px 0 0 0; font-size: 13px; color: #666; }
        .badge { display: inline-block; background: #4399f5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    
    <div class="quiz-card">
        <h2>ค้นหาน้องหมาที่ใช่สำหรับคุณ</h2>
        
        <div class="form-group">
            <label for="price">1.งบประมาณสำหรับน้องหมา:</label>
            <select id="price">
                <option value="1">ไม่เกิน 10,000 บาท</option>
                <option value="3">10,000 – 20,000 บาท</option>
                <option value="5">20,000 – 50,000 บาท</option>
                <option value="7">50,000 บาทขึ้นไป</option>
            </select>
        </div>

        <div class="form-group">
            <label for="size">2.ขนาดของน้องหมา:</label>
            <select id="size">
                <option value="1">พันธุ์เล็ก</option>
                <option value="3">พันธุ์กลาง</option>
                <option value="5">พันธุ์ใหญ่</option>
            </select>
        </div>

        <div class="form-group">
            <label for="temperament">3.ลักษณะนิสัยที่ชอบ:</label>
            <select id="temperament">
                <option value="1">สายร่าเริง ขี้อ้อน ติดเจ้าของ (Friendly & Affectionate)</option>
                <option value="2">สายฉลาด ฝึกง่าย ชอบเรียนรู้ (Smart & Easy to Train)</option>
                <option value="3">สายพลังงานสูง ซน ขยัน ชอบกิจกรรม (Energetic & Active)</option>
                <option value="4">สายปกป้อง หวงถิ่น ซื่อสัตย์สูง (Protective & Guard Dog)</option>
                <option value="5">สายสงบ ขี้เกียจ อ่อนโยน (Calm & Chill)</option>
                <option value="6">สายอิสระ มั่นใจ ดื้อ หรือมีความเป็นตัวเองสูง (Independent & Quirky)</option>         
            </select>
        </div>

        <div class="button-group">
            <a href="maindog.html" class="btn-back">ย้อนกลับ</a>
            <button type="button" onclick="submitQuiz()">วิเคราะห์ผลลัพธ์</button>
        </div>

        <div id="result" style="display: none;">
            <h3>น้องหมา 3 อันดับที่เหมาะกับคุณที่สุด:</h3>
            <div id="dog-list"></div>
        </div>
    </div>

    <script src="dog-match.js"></script>
    
</body>
</html>
