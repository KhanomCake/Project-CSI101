<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาน้องหมาที่ใช่สำหรับคุณ</title>
    <style>
        button, input, select, textarea { font-family: inherit; }
        body { font-family: 'Kanit', sans-serif; color: #163e68; margin: 0; background: #f8fcff; }
        .quiz-card { background: white; padding: 25px; border-radius: 12px; max-width: 550px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        
        
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 12px; background: #4399f5; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2f86e6; }
        
        
        .btn-back { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40%; 
            padding: 12px; 
            background: #e2e8f0; 
            color: #475569; 
            text-decoration: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        .btn-back:hover { background: #cbd5e1; }

        #result { margin-top: 25px; display: none; }
        .dog-item { display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .dog-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .dog-info h4 { margin: 0 0 5px 0; color: #333; }
        .dog-info p { margin: 5px 0 0 0; font-size: 13px; color: #666; }
        .badge { display: inline-block; background: #4399f5; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        /* ===== (เพิ่ม) ปรับหน้าตาให้เข้าชุดกับหน้า "มีสายพันธุ์ในใจแล้ว" (yourdog.css) ===== */
        /* การ์ดใหญ่ขึ้น มุมมนขึ้น เงาบางลง */
        .quiz-card {
            display: grid;
            grid-template-columns: 1fr 1fr;      /* คำถามเรียง 2 คอลัมน์ */
            column-gap: 24px;
            max-width: 760px;
            margin: 40px auto;
            padding: 36px 40px;
            border: 1px solid #EFEAE1;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(61, 64, 91, 0.06);
        }

        /* หัวข้อ ปุ่ม และผลลัพธ์ กว้างเต็มการ์ด (ไม่แบ่งคอลัมน์) */
        .quiz-card h2,
        .button-group,
        #result {
            grid-column: 1 / -1;
        }

        .quiz-card h2 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 1.6rem;
        }

        .form-group { margin-bottom: 18px; }
        label { font-weight: 600; margin-bottom: 8px; }

        /* ช่องเลือกคำตอบ: มุมมน ขอบหนา พอกดแล้วขอบเป็นสีม่วง */
        select {
            padding: 12px 14px;
            border: 2px solid #EFEAE1;
            border-radius: 12px;
            background: #fff;
            color: #3D405B;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:hover,
        select:focus {
            border-color: #5f72e0;
            outline: none;
        }

        /* ปุ่มทรงแคปซูล สีม่วงเหมือนปุ่ม "ค้นหาข้อมูล" */
        .button-group { margin-top: 10px; gap: 12px; }

        button {
            border-radius: 50px;
            background: #5f72e0;
        }

        button:hover { background: #163e68; }

        .btn-back {
            border-radius: 50px;
            background: #f3f4f6;
            color: #374151;
        }

        .btn-back:hover { background: #e5e7eb; }

        /* ผลลัพธ์: 3 อันดับเรียงเป็นการ์ดแถวเดียว */
        #result h3 {
            margin: 8px 0 16px;
            text-align: center;
        }

        #dog-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        #dog-list > div {
            margin: 0 !important;                /* ทับ margin ที่ JS ใส่ไว้ */
            padding: 14px;
            border-radius: 16px;
            background: #FDFBF7;
            border: 1px solid #EFEAE1;
            text-align: center;
        }

        #dog-list p { margin: 0 0 10px; }

        #dog-list img {
            width: 100% !important;              /* ทับขนาด 200px ที่ JS ใส่ไว้ */
            height: 160px !important;
            object-fit: cover;
            border-radius: 12px !important;
        }

        /* จอมือถือ: คำถามและผลลัพธ์เรียงคอลัมน์เดียว */
        @media (max-width: 700px) {
            .quiz-card {
                grid-template-columns: 1fr;
                margin: 20px 16px;
                padding: 24px 20px;
            }

            #dog-list { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
    <!-- เมนู navbar + แถบหัวเรื่อง: เรียกไว้บนสุดของ body ให้ขึ้นก่อนเนื้อหา -->
    <script src="../shared/navbar.js"></script>
    <script src="../shared/theme.js"></script>
    
    <div class="quiz-card">
        <h2>ค้นหาน้องหมาที่ใช่สำหรับคุณ</h2>
        
        <div class="form-group">
            <label for="price">1.งบประมาณสำหรับน้องหมา:</label>
            <select id="price">
                <option value="1">ไม่เกิน 10,000 บาท</option>
                <option value="3">10,000 – 20,000 บาท</option>
                <option value="5">20,000 – 50,000 บาท</option>
                <option value="7">50,000 บาทขึ้นไป</option>
            </select>
        </div>

        <div class="form-group">
            <label for="size">2.ขนาดของน้องหมา:</label>
            <select id="size">
                <option value="1">พันธุ์เล็ก</option>
                <option value="3">พันธุ์กลาง</option>
                <option value="5">พันธุ์ใหญ่</option>
            </select>
        </div>

        <div class="form-group">
            <label for="temperament">3.ลักษณะนิสัยที่ชอบ:</label>
            <select id="temperament">
                <option value="1">สายร่าเริง ขี้อ้อน ติดเจ้าของ (Friendly & Affectionate)</option>
                <option value="2">สายฉลาด ฝึกง่าย ชอบเรียนรู้ (Smart & Easy to Train)</option>
                <option value="3">สายพลังงานสูง ซน ขยัน ชอบกิจกรรม (Energetic & Active)</option>
                <option value="4">สายปกป้อง หวงถิ่น ซื่อสัตย์สูง (Protective & Guard Dog)</option>
                <option value="5">สายสงบ ขี้เกียจ อ่อนโยน (Calm & Chill)</option>
                <option value="6">สายอิสระ มั่นใจ ดื้อ หรือมีความเป็นตัวเองสูง (Independent & Quirky)</option>
            </select>
        </div>

        <!-- (เพิ่ม) คำถามข้อ 4-7: ใช้ข้อมูลเดียวกับ Dog Match แบบเก่า (recommend-dog) -->
        <div class="form-group">
            <label for="space">4.พื้นที่อยู่อาศัยของคุณ:</label>
            <select id="space">
                <option value="1">คอนโด / หอพัก (พื้นที่จำกัด)</option>
                <option value="3">ทาวน์เฮาส์ / บ้านมีพื้นที่เล็กน้อย</option>
                <option value="5">บ้านเดี่ยวมีสนามหญ้ากว้าง</option>
            </select>
        </div>

        <div class="form-group">
            <label for="energy">5.เวลาในการพาไปออกกำลังกาย/เดินเล่น:</label>
            <select id="energy">
                <option value="1">แทบไม่มีเวลา / ชอบพักผ่อนอยู่บ้าน</option>
                <option value="3">เดินเล่นวันละ 30 นาที</option>
                <option value="5">ชอบวิ่ง/ออกกำลังกายวันละ 1-2 ชม.</option>
            </select>
        </div>

        <div class="form-group">
            <label for="grooming">6.การดูแลเรื่องขนและหวีขน:</label>
            <select id="grooming">
                <option value="1">ชอบหมาขนสั้น ดูแลง่าย ไม่ต้องแปรง</option>
                <option value="3">ขนยาวปานกลาง แปรงขนสัปดาห์ละครั้ง</option>
                <option value="5">แปรงขนทุกวัน / เข้าร้านตัดแต่งขนได้สบาย</option>
            </select>
        </div>

        <div class="form-group">
            <label for="experience">7.ประสบการณ์การเลี้ยงสุนัข:</label>
            <select id="experience">
                <option value="1">มือใหม่ ไม่เคยเลี้ยงมาก่อน</option>
                <option value="3">เคยเลี้ยงสุนัขมาบ้าง</option>
                <option value="5">มีประสบการณ์มาก / ฝึกสุนัขพันธุ์ยาก ๆ ได้</option>
            </select>
        </div>

        <!-- (เพิ่ม) คำถามข้อ 8 -->
        <div class="form-group">
            <label for="family">8.ในบ้านมีเด็กหรือสัตว์เลี้ยงตัวอื่นไหม:</label>
            <select id="family">
                <option value="1">ไม่มี</option>
                <option value="3">มีสัตว์เลี้ยงตัวอื่น / มีเด็กโต</option>
                <option value="5">มีเด็กเล็ก</option>
            </select>
        </div>

        <div class="button-group">
            <a href="maindog.html" class="btn-back">ย้อนกลับ</a>
            <button type="button" onclick="submitQuiz()">วิเคราะห์ผลลัพธ์</button>
        </div>

        <div id="result" style="display: none;">
            <h3>น้องหมา 3 อันดับที่เหมาะกับคุณที่สุด:</h3>
            <div id="dog-list"></div>
        </div>
    </div>

    <script src="dog-match.js"></script>
    
</body>
</html>
